name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        duckdb: [latest/download/duckdb-cli-%s.tar.gz, download/v1.4.1/duckdb_cli-%s.zip]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install 'moto[server]'
      - run: |
          f=$(printf ${{ matrix.duckdb }} ${{ runner.os == 'macOS' && 'osx-universal' || 'linux-amd64' }})
          curl -sSfLO https://github.com/duckdb/duckdb/releases/$f && f=${f##*/}
          python3 -m $([[ $f = *.zip ]] && echo zip || echo tar)file -e $f "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/duckdb" && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make --version | head -1 && duckdb --version && test/run

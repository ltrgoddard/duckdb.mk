<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspect</title>
<link rel="icon" href="data:,">
<style>
/* the inspector: a list of models, a model's lineage and sql, and the rows
   of the part of it last clicked */
:root {
  --bg: #000; --fg: #fff; --mute: #808080; --line: #262626;
  --panel: #0d0d0d; --hi: #00a3a3; --err: #ff6b6b;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* {
  box-sizing: border-box; scrollbar-width: thin;
  scrollbar-color: #333 transparent;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #4d4d4d; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: none; }
:focus-visible { outline: 1px solid var(--hi); outline-offset: -1px; }
input:focus { outline: none; }
[hidden] { display: none !important; }
html { background: var(--bg); color: var(--fg); }
body {
  margin: 0; height: 100vh; display: grid;
  grid: "nav main" 1fr / var(--nav, 260px) minmax(0, 1fr);
  font: 14px/1.45 system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-underline-offset: .2em; }
nav {
  grid-area: nav; overflow: auto; padding: 16px;
  font: 13px/1.6 var(--mono); border-right: 1px solid var(--line);
}
/* the filter's text, not its box, lines up with the list */
nav input {
  width: calc(100% + 18px); padding: 6px 8px; margin: 0 -9px 12px;
  font: inherit;
  background: var(--panel); color: inherit; border: 1px solid var(--line);
}
nav h2 {
  margin: 16px 0 4px; font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .06em; color: var(--mute);
}
nav a {
  display: block; padding: 1px 0; text-decoration: none; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
nav a.off, .dag a.off { color: var(--mute); }
nav a.old, .dag a.old { font-style: italic; }
nav a:hover, nav a.on { color: var(--hi); }
main {
  grid-area: main; min-width: 0; display: grid;
  grid: "head head" auto "sql out" 1fr / minmax(0, var(--split, 50%))
    minmax(0, 1fr);
  overflow: hidden; position: relative;
}
header {
  grid-area: head; padding: 16px 20px; max-height: var(--head, 50vh);
  display: flex; flex-direction: column; overflow: auto;
  border-bottom: 1px solid var(--line);
}
h1 { margin: 0 0 4px; font: 500 18px var(--mono); }
header p { margin: 4px 0; max-width: 80ch; }
.note, .file { color: var(--mute); }
.file { font: 12.5px var(--mono); }
.file span { margin-left: 2ch; }
pre {
  margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap;
  overflow-wrap: anywhere;
}
#sql { grid-area: sql; overflow: auto; padding: 16px 20px; }
/* steps or sql, as the viewer last chose; sql if a query has no steps */
.view {
  position: sticky; top: -16px; margin: -16px 0 8px; padding: 16px 0 4px;
  background: var(--bg);
}
.view button + button { margin-left: -1px; }
.view button[aria-pressed=true] {
  position: relative; color: var(--fg); border-color: var(--mute);
}
body.code .plan, body:not(.code) .plan:not(:empty) + pre { display: none; }
.plan { margin: 0; padding: 0; list-style: none; max-width: 80ch; }
.plan li {
  padding: 3px 8px; margin-bottom: 2px; cursor: pointer;
  border-left: 2px solid var(--line);
}
.plan li:hover { border-color: var(--mute); }
.plan li.on { border-color: var(--hi); background: var(--panel); }
.plan ul { margin: 2px 0 0; padding-left: 1.2em; list-style: none; }
/* the same colours in the steps as in the sql: a query's name green, a
   string, such as a file's place, yellow, a number orange */
#sql .name { color: #98c379; }
#sql .plan .at { color: #e6c07b; overflow-wrap: anywhere; }
.plan .fn, #sql span[title]:not([title=""]):not(.cl) {
  text-decoration: underline dotted var(--mute); text-underline-offset: .25em;
  cursor: help;
}
.plan ul li { border: 0; padding: 1px 0; margin: 0; }
button {
  font: 12px system-ui, sans-serif;
  color: var(--mute); background: var(--bg); border: 1px solid var(--line);
  padding: 3px 8px; cursor: pointer;
}
button:hover { color: var(--fg); }
#sql .c { color: var(--mute); }
#sql .s { color: #e6c07b; }
#sql .n { color: #d19a66; }
#sql .k { color: #c678dd; }
#sql .cl {
  color: #c678dd; cursor: pointer; text-decoration: underline dotted;
  text-underline-offset: .25em;
}
#sql .cl:hover, #sql .cl.on { background: var(--hi); color: #000; }
#sql a { color: #61afef; }
#out {
  grid-area: out; min-width: 0; display: flex; flex-direction: column;
  position: relative;
  border-left: 1px solid var(--line); overflow: hidden;
}
.drag {
  position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; z-index: 1;
  cursor: col-resize; touch-action: none;
}
#drag-nav { left: 0; width: 5px; }
#drag-head {
  position: static; grid-area: head; align-self: end; width: auto;
  height: 8px; margin-bottom: -4px; cursor: row-resize;
}
.drag:hover, .drag.on { background: var(--hi); opacity: .5; }
/* as high with the count's button as without it */
#status {
  display: flex; align-items: center; gap: 6px; min-height: 36px;
  padding: 4px 12px; color: var(--mute); font-size: 12px;
}
#status.err {
  color: var(--err); white-space: pre-wrap; font-family: var(--mono);
}
#rows { overflow: auto; flex: 1; }
table {
  border-collapse: collapse; min-width: 100%; font: 12px/1.4 var(--mono);
}
th, td {
  padding: 3px 10px; border-bottom: 1px solid var(--line); text-align: left;
  vertical-align: top; max-width: 40ch; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
td:hover { white-space: normal; overflow-wrap: anywhere; }
th {
  position: sticky; top: 0; background: var(--bg); font-weight: 500;
}
th small { display: block; color: var(--mute); font-weight: 400; }
.r { text-align: right; }
/* lineage: a table's colour is its schema's; one not built is grey */
/* the graph takes the header's height left over, so that its scroll bar is
   at the foot of the pane; the header scrolls when three rows do not fit */
.dag { position: relative; overflow: auto; margin-top: 12px; }
body.all .dag { flex: 1; }
.dag svg { display: block; }
.dag path { fill: none; stroke: #3a3a3a; stroke-width: 1.2; }
.dag:has(a:hover) path { opacity: .25; }
.dag path.on { stroke: var(--hi); opacity: 1 !important; stroke-width: 2; }
.dag a {
  position: absolute; height: 20px; padding: 0 8px; font: 12px/20px
  var(--mono); text-decoration: none; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; background: var(--panel);
  border: 1px solid var(--line); border-left: 3px solid var(--s, #808080);
}
.dag a:hover, .dag a.on { background: var(--s, #808080); color: #000; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend span {
  padding-left: 6px; color: var(--mute); font: 12px var(--mono);
  border-left: 3px solid var(--s, #808080);
}
body.all main { grid: "head" 1fr / minmax(0, 1fr); }
body.all header { max-height: none; border: 0; }
body.all #sql, body.all #out, body.all #drag-head { display: none; }
td.null { color: var(--mute); }
@media (max-width: 860px) {
  body { height: auto; grid: "main" auto "nav" auto / 1fr; }
  main { grid: "head" auto "sql" auto "out" 80vh / minmax(0, 1fr); }
  #out { border-left: 0; border-top: 1px solid var(--line); }
  .drag { display: none; }
  header, #sql { padding: 16px; }
  /* the names in as many columns as fit, each schema's under its heading */
  nav { display: grid; column-gap: 16px; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  nav input, nav h2 { grid-column: 1 / -1; }
}
</style>
<nav><input type="search" name="q" placeholder="Filter"
  aria-label="Filter"></nav>
<main>
<header><h1>Loading DuckDB</h1></header>
<div id="drag-nav" class="drag" aria-hidden="true"></div>
<div id="drag-head" class="drag" aria-hidden="true"></div>
<div id="sql"><div class="view"><button data-v="">Steps</button><button
  data-v="code">SQL</button></div><div id="code"></div></div>
<div id="out">
<div id="drag-split" class="drag" aria-hidden="true"></div>
<div id="status"></div>
<div id="rows"></div>
</div>
</main>
<script>
// an error that nothing catches, such as a file that does not load, shows
for (const t of ["error", "unhandledrejection"]) addEventListener(t, e =>
  Object.assign(document.querySelector("#status"), {className: "err",
    textContent: e.message ?? e.reason?.message ?? e.reason}))
</script>
<script type="module">
// the inspector: a duckdb.mk project's models and tests, their lineage as
// the plan has it, and each one's sql, run in the browser a clause at a
// time over the tables as make last built them. inspect.json (make inspect)
// holds the nodes, the macros and the files; a file is at files/<its path>
import {formatDialect, duckdb as dialect} from
  "https://cdn.jsdelivr.net/npm/sql-formatter@15.9.0/+esm"

// duckdb ----------------------------------------------------------------------

// duckdb in the browser: duckdb-wasm and its worker from jsdelivr, at one
// version. file() names a url as the path that the sql reads it by
const V = "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.33.1-dev114.0/"
const duckdb = await import(V + "+esm")
const db = new duckdb.AsyncDuckDB(new duckdb.VoidLogger, new Worker(
  URL.createObjectURL(new Blob([`importScripts("${V
  }dist/duckdb-browser-base.worker.js")`], {type: "text/javascript"}))))
await db.instantiate(V + "dist/duckdb-base.wasm")
const c = await db.connect()
const query = s => c.query(s)
const sql = async s => (await c.query(s)).toArray()
const file = (path, url) => db.registerFileURL(path,
  new URL(url, location).href, duckdb.DuckDBDataProtocol.HTTP, false)

// sql -------------------------------------------------------------------------

// sql as tokens, and the part of a query that gives the rows at a clause

// a token: k its kind (comment, string, quoted name, number, word, space,
// punctuation), w a word in lower case, o the bracket that it is in (-1 at
// the top), and for a bracket c its close; a clause keyword (cl) starts a
// part of a query
const re = new RegExp(["(--[^\\n]*|/\\*[\\s\\S]*?\\*/)",
  "([eE]'(?:[^'\\\\]|\\\\.|'')*'|'(?:[^']|'')*')", '("(?:[^"]|"")*")',
  "(\\d[\\w.]*)", "([A-Za-z_][\\w$]*)", "(\\s+)", "([\\s\\S])"].join("|"), "g")
const set = s => new Set(s.split(" "))
const K = set("with select from where group having qualify order " +
  "limit join union except intersect")
const SET = set("union except intersect")
const MOD = set("left right inner outer full cross natural semi anti " +
  "asof positional")
const skip = d => (ts, i) => {
  do i += d; while (ts[i]?.k in {c: 1, _: 1})
  return i
}
const nx = skip(1), pv = skip(-1)
const lex = s => {
  const ts = [], st = []
  for (const m of s.matchAll(re)) {
    const t = m[0], k = "csqnw_p"[m.slice(1).findIndex(x => x != null)]
    if (")]}".includes(t) && st.length) ts[st.pop()].c = ts.length
    ts.push({t, k, w: k === "w" ? t.toLowerCase() : null, o: st.at(-1) ?? -1})
    if ("([{".includes(t)) st.push(ts.length - 1)
  }
  ts.forEach((x, i) => x.cl = K.has(x.w) && !(
    (x.w === "group" || x.w === "order") && ts[nx(ts, i)]?.w !== "by" ||
    x.w === "from" && ts[pv(ts, i)]?.w === "distinct" ||
    x.w === "with" && ts[pv(ts, i)] && ts[pv(ts, i)].t !== "("))
  return ts
}
// the text from a to b, less comments
const tx = (ts, a, b) =>
  ts.slice(a, b).map(x => x.k === "c" ? " " : x.t).join("").trim()
// whether the bracket g holds a query
const holds = (ts, g) =>
  ["with", "select", "from"].includes(ts[nx(ts, g)]?.w)
// the stretches between the commas of the bracket g, from a to b
const split = (ts, a, b, g) => {
  const r = []
  for (let j = a, c = a; j <= b; j++)
    if (j === b || ts[j].o === g && ts[j].t === ",") r.push([c, j]), c = j + 1
  return r
}
// the statements of a file
const statements = s => {
  const ts = lex(s), e = ts.flatMap((x, j) => x.t === ";" && x.o < 0 ? [j] : [])
  return [...e, ts.length].map((j, k) => tx(ts, (e[k - 1] ?? -1) + 1, j))
    .filter(Boolean)
}
// a column: where its expression ends, and its name if it has one
const cut = (ts, u, v) => {
  const e = pv(ts, v), p = pv(ts, e), x = ts[e]
  return p >= u && (x.k === "w" || x.k === "q") &&
    !/^(end|null|true|false)$/.test(x.w) && (ts[p].w === "as" ||
    ts[p].k !== "p" || /[)\]'"]/.test(ts[p].t)) && ts[p].t !== "."
    ? [ts[p].w === "as" ? p : e, x.t] : [v, null]
}

// sql laid out, as tokens: lower case, two spaces, no space before the "("
// of a call that the formatter does not know (a macro), strings that follow
// each other, which the formatter puts on one line, as one, and a row
// written by hand (values) on one line; as written if the formatter fails
const KEEP = set("in as and or not exists over filter using on values from " +
  "join select where when then else by all any some recursive union except " +
  "intersect lateral is with case like")
// strings that the source joins with || (to keep its lines short), as one
const glue = s => {
  const ts = lex(s), q = x => x?.k === "s" && x.t[0] === "'"
  const w = j => ts[j]?.k === "_" ? j + 1 : j
  let o = ""
  for (let i = 0, j; i < ts.length; i++) {
    let t = ts[i].t
    while (q(ts[i]) && ts[j = w(i + 1)]?.t + ts[j + 1]?.t === "||" &&
      q(ts[j = w(j + 2)])) t = t.slice(0, -1) + ts[j].t.slice(1), i = j
    o += t
  }
  return o
}
const pretty = s => {
  s = glue(s)
  try {
    const a = [...formatDialect(s, {dialect, keywordCase: "lower",
      dataTypeCase: "lower", functionCase: "lower", expressionWidth: 72})
      .matchAll(re)], str = m => m?.[0][0] === "'"
    s = a.map((m, i) => m[0] === " " && a[i - 1]?.[5] &&
      !KEEP.has(a[i - 1][0].toLowerCase()) && a[i + 1]?.[0] === "(" ? ""
      : m[6] && str(a[i - 1]) && str(a[i + 1]) ? ""
      : str(m) ? m[0].slice(+!!(str(a[i - 2]) && a[i - 1][6]),
        str(a[i + 2]) && a[i + 1][6] ? -1 : undefined) : m[0]).join("")
  } catch {}
  const ts = lex(s)
  ts.forEach((x, i) => x.w === "values" && ts.forEach((r, j) => {
    if (j < i || r.o !== x.o || r.t !== "(") return
    for (let k = j + 1; k < r.c; k++) if (ts[k].k === "_")
      ts[k].t = k === j + 1 || k === r.c - 1 ? "" : " "
  }))
  return ts
}

// a query's level: the tokens in the "(" g, its clauses, and its with
// clause from W to its main query at m
const level = (ts, g) => {
  const a = g + 1, b = g < 0 ? ts.length : ts[g].c ?? ts.length, cl = []
  for (let j = a; j < b; j++) ts[j].o === g && ts[j].cl && cl.push(j)
  const W = ts[cl[0]]?.w === "with" ? cl[0] : -1
  return {a, b, cl, W, m: W < 0 ? a : cl.find(j => ts[j].w !== "with") ?? b}
}
// the ctes of a level's with clause that a query at p can read: all of
// them from its main query, those before p's own from inside one
const ctes = (ts, l, g, p) => {
  const a = nx(ts, l.W), s = ts[a].w === "recursive" ? nx(ts, a) : a
  const r = split(ts, s, l.m, g).filter(([, j]) => p >= l.m || j <= p)
  return {r: r.map(u => tx(ts, ...u)), rec: s !== a}
}
// the sql that gives the rows at clause i: its query up to the next
// clause, each table so far (select *, else its own select list, whose
// names a where may use) for a from, join or where, and the ctes it can
// read; a list of tries
const part = (ts, i) => {
  const g = ts[i].o, l = level(ts, g), w = ts[i].w
  const whole = w === "with" || SET.has(w)
  let q
  if (whole) q = [tx(ts, l.m, l.b)]
  else {
    const cl = l.cl.filter(j => j >= l.m)
    let s = (cl.filter(j => j < i && SET.has(ts[j].w)).at(-1) ?? l.m - 1) + 1
    while (["all", "distinct", "by", "name"].includes(ts[nx(ts, s - 1)].w))
      s = nx(ts, s - 1) + 1
    const e = cl.find(j => j > i && SET.has(ts[j].w)) ?? l.b
    const sc = cl.filter(j => j >= s && j < e), fr = sc.includes(i) &&
      ["from", "join"].includes(w)
    let end = sc.find(j => j > i && (fr || ts[j].w !== "join")) ?? e
    if (ts[end]?.w === "join")
      while (MOD.has(ts[pv(ts, end)]?.w)) end = pv(ts, end)
    const sel = ts[sc[0]].w === "select"
    q = sel && w === "select" ? [tx(ts, s, e)]
      : sel && ["from", "join", "where"].includes(w)
      ? ["select * " + tx(ts, sc.find(j => ts[j].w === "from"), end),
        tx(ts, s, end)] : [tx(ts, s, end)]
  }
  const cs = []
  let rec = false
  for (let G = g, p = whole ? l.m : i; ; p = G, G = ts[G].o) {
    const lv = G === g ? l : level(ts, G)
    if (lv.W >= 0 && p > lv.W) {
      const x = ctes(ts, lv, G, p)
      cs.unshift(...x.r), rec ||= x.rec
    }
    if (G < 0) break
  }
  return q.map(q => cs.length ? `with ${rec ? "recursive " : ""}${
    cs.join(",\n")}\n${q}` : q)
}

// plan ------------------------------------------------------------------------

// a plan: a query's steps in the order that they run, in words. steps(ts,
// ref) gives {d, t, i, cols}: a depth, a text, the clause that gives its
// rows, and a select's columns. ref(ts, i) gives the models that the token
// at i names, as {n, len}. a text marks a model's name, a query's, a
// file's place and a literal of kind k (MARK) for the page to set apart

const MARK = /([\x01-\x03\x05][^\x04]*\x04)/
const MODEL = s => `\x01${s}\x04`, NAME = s => `\x02${s}\x04`
const AT = s => `\x03${s}\x04`, LIT = (k, s) => `\x05${k}${s}\x04`
// a call in words
const PH = Object.entries({
  "the number of rows": "count()", "the number of {0}": "count",
  "the total of {0}": "sum", "the mean of {0}": "avg mean",
  "the median of {0}": "median", "the lowest {0}": "min",
  "the highest {0}": "max", "any {0}": "any_value", "the first {0}": "first first_value",
  "the last {0}": "last last_value",
  "the {0} with the highest {1}": "arg_max max_by",
  "the {0} with the lowest {1}": "arg_min min_by",
  "the list of {0}": "list array_agg", "{0} joined by {1}": "string_agg",
  "whether any {0}": "bool_or", "whether every {0}": "bool_and",
  "{1} if {0}, else {2}": "if iff", "{0}, null if {1}": "nullif",
  "{0} rounded|{0} rounded to {1} places": "round", "{0} rounded down": "floor",
  "{0} rounded up": "ceil", "the size of {0}": "abs",
  "each of {0}": "unnest", "the length of {0}": "len length array_length",
  "the year of {0}": "year", "the month of {0}": "month",
  "{0} as {1}": "strftime", "{1} to the {0}": "date_trunc",
  "the {0}s from {1} to {2}": "date_diff datediff date_sub",
  "{0} with {1} as {2}": "replace regexp_replace",
  "{0} matches {1}": "regexp_matches",
  "the part of {0} that matches {1}": "regexp_extract",
  "{0} starts with {1}": "starts_with", "{0} ends with {1}": "ends_with suffix",
  "every part of {0} that matches {1}": "regexp_extract_all",
  "the place of {1} in {0}": "strpos instr list_position list_indexof",
  "{0} read as a date in the form {1}": "strptime try_strptime",
  "the file name in {0}": "parse_filename", "the type of {0}": "json_type typeof",
  "each item of {0}|each item of {1} in {0}": "json_each",
  "{0}|the {1} in {0}": "json_extract json_extract_string",
  "the length of {0}|the length of {1} in {0}": "json_array_length",
  "the {0} of {1}": "date_part datepart", "${0}": "getenv",
  "today": "today() current_date()", "the standard deviation of {0}": "stddev",
  "{0} contains {1}": "contains list_contains",
  "part {2} of {0} split at {1}": "split_part",
  "{0} split at {1}": "string_split", "{0}": "lower upper trim strip",
  "the previous {0}": "lag", "the next {0}": "lead",
  "the row's place": "row_number()", "the rank": "rank() dense_rank()",
  "the distance from {0} to {1}": "st_distance",
  "{0} meets {1}": "st_intersects", "{0} contains {1}": "st_contains",
  "the point at {0}, {1}": "st_point", "{0} is within {2} of {1}": "st_dwithin"
}).reduce((o, [t, fs]) => (fs.split(" ").forEach(f => o[f] = t), o), {})
const AGG = new RegExp(`^(${("count sum avg mean median min max any_value " +
  "first arg_max max_by arg_min min_by list array_agg string_agg bool_or " +
  "bool_and stddev").split(" ").join("|")})$`)
const JOIN = {"": "Join {0}, where {1}", inner: "Join {0}, where {1}",
  left: "Join {0} where {1}, keeping the rows with no match",
  semi: "Keep the rows with a match in {0}, where {1}",
  anti: "Keep the rows with no match in {0}, where {1}",
  cross: "Pair each row with every row of {0}",

      else if (x.t === "|" && ts[i + 1]?.t === "|") o += " followed by ", i++
      else if (x.w === "null") o += " no value "

      .replace(/ ([)\],])/g, "$1")
      .replace(/<>|!=/g, "≠").replace(/>=/g, "≥").replace(/<=/g, "≤")
      .replace(PATH, (_, a, ks) => [...ks.matchAll(KEY)].reduce((s, k) =>

      .replace(/\bunbounded (preceding|following)\b/g, (_, w) =>
        `the ${w === "preceding" ? "first" : "last"} row`)
      .replace(/\bcurrent row\b/g, "this row")
      .replace(/(\x05n(\d+)\x04) (preceding|following)\b/g, (_, l, n, w) =>

        "descending").replace(/\basc\b/g, "ascending").trim()

  // named by its alias (else a letter), so that a plan reads in the order
  // its rows are made; "(from t)" is t, with no step
  const cx = {pre: [], n: 0, names: new Set}

        const j = nx(ts, a - 1), p = nx(ts, j), m = ts[p]?.t === "(" &&

            in_}, with totals` : w === "grouping" && in_ ? "Group the rows " +

    i: l.cl.find(j => j >= l.m)}, ...out.map(x => ({...x, d: x.d + 1}))] : out
}

// lineage ---------------------------------------------------------------------

// lineage: the tables that none of the others read in the last column,
// those that read none of the others in the first, and the rest between by
// their longest path from the first, so that every line runs rightward.
// each column is by group, a group's tables together with a gap between,
// and within a group by the mean place of the tables a table reads, then
// of those that read it, back and forth, to cross fewer lines. a node has
// an id, the set of nodes it reads, a group and its element's attributes
const W = 170, G = 56, R = 24, NS = "http://www.w3.org/2000/svg"
const dag = (ns, me) => {
  const set = new Set(ns), d = new Map, y = new Map, cols = []
  const ins = n => [...n.reads].filter(x => set.has(x) && x !== n)
  const outs = n => ns.filter(x => ins(x).includes(n))
  const dep = n => d.get(n) ?? (d.set(n, 0),
    d.set(n, Math.max(-1, ...ins(n).map(dep)) + 1).get(n))
  ns.forEach(dep)
  const end = Math.max(1, ...ns.filter(n => outs(n).length).map(n =>
    d.get(n) + 1))
  ns.forEach(n => !outs(n).length && d.set(n, end))
  ns.forEach(n => (cols[d.get(n)] ??= []).push(n))
  cols.forEach(c => c.sort((a, b) => a.id.localeCompare(b.id))
    .forEach((n, j) => y.set(n, j)))
  const mean = (n, f) => f(n).length ? f(n).reduce((a, x) => a + y.get(x), 0)
    / f(n).length : y.get(n)
  const place = c => {
    let g = 0
    c.forEach((n, j) => y.set(n, j + (g += j && n.group !== c[j - 1].group
      ? .5 : 0)))
  }
  for (let k = 0; k < 8; k++) for (const c of k % 2 ? [...cols].reverse()
    : cols) c && place(c.sort((a, b) => a.group.localeCompare(b.group) ||
      mean(a, k % 2 ? outs : ins) - mean(b, k % 2 ? outs : ins)))
  const svg = document.createElementNS(NS, "svg"), box = document
    .createElement("div"), at = n => [d.get(n) * (W + G), y.get(n) * R + R / 2]
  svg.setAttribute("width", cols.length * (W + G))
  const H = (Math.max(...y.values()) + 1) * R
  svg.setAttribute("height", H), box.style.minHeight = Math.min(H, 3 * R) + "px"
  box.className = "dag", box.append(svg)
  const light = id => box.querySelectorAll("path").forEach(p =>
    p.classList.toggle("on", p.dataset.e.split(" ").includes(id)))
  for (const n of ns) {
    const [x, t] = at(n), a = Object.assign(document.createElement("a"), {
      href: "#" + n.id, title: n.id, textContent: n.id, ...n.attrs,
      onmouseenter: () => light(n.id), onmouseleave: () => light()})
    a.style.cssText += `;left:${x}px;top:${t - R / 2 + 2}px;width:${W}px`
    a.classList.toggle("on", n === me)
    box.append(a)
    for (const r of ins(n)) {
      const [x1, y1] = at(r), x0 = x1 + W, m = (x0 + x) / 2
      const p = document.createElementNS(NS, "path")
      p.setAttribute("d", `M${x0} ${y1}C${m} ${y1} ${m} ${t} ${x} ${t}`)
      p.dataset.e = r.id + " " + n.id
      svg.append(p)
    }
  }
  return box
}

// rows ------------------------------------------------------------------------

// rows: a query's first N, as text, and N more each time the table is
// scrolled to its foot; the count only when asked for. a float is to six
// figures, or to a whole number if that is longer, with all of them on
// hover. an error of a kind in WHY has its likely cause before it.
// grid(st, out) gives run(tries): the first of them that runs

const N = 200, WHY = [[/Referenced (table|column)/, "This part cannot run " +
  "alone if it uses columns of the query around it."],
  [/Table with name|Failed to open|No files found/, "A table or file that " +
  "this reads is not here: not built, or named by a macro or a variable."],
  [/NetworkError|GDAL|HTTP|Extension/, "The browser could not read a source " +
  "on another site, or lacks an extension."],
  [/Out of Memory|out of bounds|null function|unreachable/, "This needs " +
  "more memory than the browser gives DuckDB. Reload the page."]]
const NUM = /^(U?(TINY|SMALL|BIG|HUGE)?INT|INTEGER|FLOAT|DOUBLE|DECIMAL)/
const FLT = /^(FLOAT|DOUBLE|DECIMAL)/
// an element: its properties, its dataset, and its children, less the empty
const h = (tag, {dataset, ...a} = {}, ...k) => {
  const e = Object.assign(document.createElement(tag), a)
  Object.assign(e.dataset, dataset)
  return e.append(...k.flat().filter(x => x != null && x !== false)), e
}
const cell = v => v == null || typeof v !== "object" ? v
  : v.byteLength != null ? `${v.byteLength} bytes`
  : JSON.stringify(v.toJSON?.() ?? v, (_, x) =>
    typeof x === "bigint" ? String(x) : x)
const sub = q => `(\n${q.replace(/;\s*$/, "")}\n)`
const page = (q, o) => query(
  `select columns(*)::varchar from ${sub(q)} limit ${N + 1} offset ${o}`)
  .catch(() => query(`from ${sub(q)} limit ${N + 1} offset ${o}`))

const grid = (st, out) => {
  let runs = 0, more
  const say = (t, err) => (st.className = err ? "err" : "", st.textContent = t)
  out.onscroll = () => more &&
    out.scrollTop + out.clientHeight > out.scrollHeight - 400 && more()
  const run = async qs => {
    const k = ++runs, t0 = performance.now()
    qs = [qs].flat(), more = null, say("Running")
    try {
      let q, t
      for (const [i, x] of qs.entries()) try {
        t = await page(x, 0), q = x
        break
      } catch (e) { if (i === qs.length - 1) throw e }
      const ty = await sql(`describe select * from ${sub(q)}`)
      if (k !== runs) return
      const body = h("tbody"), s = n => n === 1 ? "" : "s"
      const tell = (n = body.rows.length) => st.replaceChildren(
        `${n.toLocaleString()} row${s(n)}, ${ty.length} column${s(ty.length)
        } in ${
        Math.round(performance.now() - t0)} ms${more ? ", more below" : ""} `,
        ...more || n > N ? [h("button", {onclick: async e => {
          e.target.textContent = "Counting"
          const [{n}] = await sql(`select count(*)::int n from ${sub(q)}`)
          k === runs && e.target.replaceWith(`of ${n.toLocaleString()}`)
        }}, "Count")] : [])
      const add = t => {
        const cols = t.schema.fields.map((_, j) => t.getChildAt(j))
        body.append(...Array.from({length: Math.min(t.numRows, N)}, (_, i) =>
          h("tr", {}, ...cols.map((col, j) => {
            const raw = cell(col.get(i)), f = FLT.test(ty[j].column_type)
            const v = f && isFinite(raw) ? String(Math.abs(raw) < 1e5
              ? +(+raw).toPrecision(6) : Math.round(raw)) : raw
            return h("td", {className: v == null ? "null"
              : NUM.test(ty[j].column_type) ? "r" : "",
              title: v === raw ? "" : raw}, v ?? "null")
          }))))
        more = t.numRows > N && (async () => {
          more = null, st.firstChild.textContent = "Loading more "
          const u = await page(q, body.rows.length)
          k === runs && (add(u), tell())
        })
      }
      add(t)
      out.replaceChildren(h("table", {}, h("thead", {}, h("tr", {},
        ...ty.map(r => h("th", {className: NUM.test(r.column_type) ? "r" : ""},
          r.column_name, h("small", {}, r.column_type))))), body))
      out.scrollTop = 0, tell()
    } catch (e) {
      if (k === runs) out.replaceChildren(), say([WHY.find(([r]) =>
        r.test(e.message))?.[1], e.message].filter(Boolean).join("\n\n"), 1)
    }
  }
  // no rows, and why
  run.say = (t, err) => (runs++, more = null, out.replaceChildren(),
    say(t, err))
  return run
}

// page ------------------------------------------------------------------------

const $ = q => document.querySelector(q)
const narrow = matchMedia("(max-width: 860px)")
const nav = $("nav"), head = $("header"), out = $("#rows")
const run = grid($("#status"), out)
const cfg = await (await fetch("inspect.json")).json()
const {nodes, files} = cfg, by = Object.fromEntries(nodes.map(m => [m.id, m]))

// the files by the paths that the sql names, the variables that the
// makefile sets and the macros, as in make, less the shell's dot
// commands; each built model a view on its table
const lit = v => `'${String(v).replaceAll("'", "''")}'`
const qn = s => `"${s.replaceAll('"', '""')}"`
const glob = s => new RegExp("^" + s.replace(/[.+^$()|[\]\\{}]/g, "\\$&")
  .replace(/\*\*\/|\*|\?/g, m => ({"*": "[^/]*", "?": "[^/]"})[m] ?? "(.*/)?")
  + "$")
await Promise.all(files.map(f => file(f, "files/" + f)))
await query(`create macro getenv(k) as coalesce(map {'': ''${Object.entries(
  cfg.env).map(([k, v]) => `, ${lit(k)}: ${lit(v)}`).join("")}}[k], '')`)
for (const m of nodes) {
  const d = m.sql.match(/^(--( .*)?\n)*/)[0], [s, t] = m.id.includes(".")
    ? m.id.split(".") : ["main", m.id]
  ;[m.desc, m.note] = d.split("\n--\n").map(t =>
    t.replace(/^-- ?/gm, "").replace(/\s+/g, " ").trim())
  m.body = m.sql.slice(d.length), m.group = m.test ? "test" : s
  m.reads = new Set(m.reads.map(id => by[id]))
  m.view = `${qn(s)}.${qn(t)}`
  m.built = !m.test && files.some(f => glob(m.out).test(f)) && await query(
    `create schema if not exists ${qn(s)};
    create view ${m.view} as from ${lit(m.out)}`).then(() => true,
    e => console.warn(m.id, e.message))
  // stale: its table stores sql that is not the file's
  const [k] = m.built ? await sql(`select decode(value) v from
    parquet_kv_metadata(${lit(m.out)}) where decode(key) = 'sql'`)
    .catch(() => []) : []
  m.stale = k != null && k.v !== m.sql
}
for (const {file, sql: s} of cfg.macros)
  for (const q of statements(s.replace(/^\..*$/gm, "")))
    await query(q).catch(e => console.warn(file, e.message))
// what duckdb says of each function, and a macro's definition, for hover
const FN = Object.fromEntries((await sql(`select function_name f,
  coalesce(any_value(description), any_value(macro_definition)) d
  from duckdb_functions() group by all having d is not null`)
  .catch(() => [])).map(r => [r.f, r.d]))

// the models that the token at i of m's sql names: schema.table, a table
// of the main schema after from or join, or a string that is a model's
// name, its path or a glob of it; only those that the plan says m reads
const ref = m => (ts, i) => {
  const x = ts[i], dot = ts[i + 1]?.t === "." && ts[i + 2]?.k === "w"
  const n = x.k === "s" ? [...m.reads].filter(n => !n.test && [n.target,
    n.out, n.id, "main." + n.id].includes(x.t.slice(1, -1)) ||
    glob(x.t.slice(1, -1)).test(n.out))
    : x.k !== "w" || ts[i - 1]?.t === "." ? []
    : dot ? [by[`${x.w}.${ts[i + 2].w}`.replace(/^main\./, "")]]
    : /^(from|join)$/.test(ts.findLast((y, j) => j < i && !(y.k in
      {c: 1, _: 1}))?.w) && ts[i + 1]?.t !== "(" ? [by[x.w]] : []
  return m.reads.has(n[0]) ? {n, len: x.k === "w" && dot ? 3 : 1} : null
}
// every table before a model, and every table after it
const up = (m, s = new Set) =>
  (m.reads.forEach(x => s.has(x) || (s.add(x), up(x, s))), s)
const down = (m, s = new Set) => (nodes.forEach(x => x.reads.has(m) &&
  !s.has(x) && (s.add(x), down(x, s))), s)

// the list: the nodes that INSPECT_HIDE does not name, by schema. the
// schemas are in the graph's order, left to right: by the mean number of
// tables before theirs, the schema with more tables first when that is the
// same, and the tests last. a schema's colour is its place in that order
const HIDE = new RegExp(cfg.hide || "^$")
const label = g => g === "test" ? "tests" : g
const shown = nodes.filter(m => !HIDE.test(m.id))
const inG = g => shown.filter(m => m.group === g), far = g => g === "test"
  ? Infinity : inG(g).reduce((a, m) => a + up(m).size, 0) / inG(g).length
const groups = [...new Set(shown.map(m => m.group))].sort((a, b) =>
  far(a) - far(b) || inG(b).length - inG(a).length)
const HUES = ["#e6c07b", "#61afef", "#98c379", "#c678dd", "#56b6c2",
  "#d19a66", "#e06c75", "#abb2bf"]
for (const m of nodes) m.attrs = {className: m.stale ? "old"
  : m.built || m.test ? "" : "off",
  style: `--s:${m.test ? "#808080"
    : HUES[groups.indexOf(m.group) % HUES.length]}`}
// the filter matches a name or its schema (q), and hides a schema's
// heading when it hides all of its names
const link = (id, a, q = a) => h("a", {href: "#" + encodeURIComponent(id),
  dataset: {id, q: q.toLowerCase()}, className: by[id]?.attrs.className ??
  ""}, a)
nav.append(link("", "All tables"), ...groups.flatMap(g => [
  h("h2", {}, label(g)), ...inG(g).map(m =>
    link(m.id, m.id.replace(/^.*[./]/, ""), `${label(g)} ${m.id}`))]))
$("nav input").oninput = e => {
  const v = e.target.value.toLowerCase()
  let any = 0
  for (const x of [...nav.children].reverse())
    x.tagName === "A" ? any |= !(x.hidden = !x.dataset.q.includes(v))
    : x.tagName === "H2" && (x.hidden = !any, any = 0)
}
// j or down opens the next item in the list, k or up the one before; enter
// on a step or a clause is a click
addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches?.("[tabindex]"))
    return e.target.click()
  const k = {j: 1, ArrowDown: 1, k: -1, ArrowUp: -1}[e.key]
  if (!k || e.target.matches?.("input") || e.metaKey || e.ctrlKey || e.altKey)
    return
  const as = [...nav.querySelectorAll("a:not([hidden])")]
  const a = as[as.indexOf(nav.querySelector(".on")) + k]
  if (!a) return
  e.preventDefault(), document.activeElement?.blur()
  a.click()
})
// the lines between the panes move, and stay where they were put: the
// list's (a share of the window's width), the header's (of its height) and
// the one between the sql and the rows (of main's width)
for (const [id, el, y, lo, hi, u] of [["nav", document.body, 0, 8, 50, "vw"],
  ["head", $("main"), 1, 8, 85, "vh"], ["split", $("main"), 0, 15, 85, "%"]]) {
  const drag = $("#drag-" + id), key = "inspect." + id
  const at = v => el.style.setProperty("--" + id,
    Math.min(hi, Math.max(lo, v)) + u)
  try { localStorage[key] && at(+localStorage[key]) } catch {}
  const stop = () => {
    drag.onpointermove = null, drag.classList.remove("on")
    try { localStorage[key] = parseFloat(el.style.getPropertyValue("--" +
      id)) } catch {}
  }
  drag.onpointerdown = e => {
    e.preventDefault(), drag.setPointerCapture(e.pointerId)
    drag.classList.add("on")
    drag.onpointermove = e => {
      if (!e.buttons) return stop()
      const r = el.getBoundingClientRect()
      at(y ? (e.clientY - r.top) / r.height * 100
        : (e.clientX - r.left) / r.width * 100)
    }
  }
  drag.onpointerup = drag.onpointercancel = drag.onlostpointercapture = stop
}

// a model's plan and sql: a step or a clause runs the query to it, and is
// marked in both, by the token (i) that starts it; a table's name opens it
const on = () => [...document.querySelectorAll("#sql .on")]
const mark = (i, q) => {
  on().forEach(e => e.classList.remove("on"))
  document.querySelectorAll(`#sql [data-i="${i}"]`).forEach(e =>
    e.classList.add("on"))
  narrow.matches && out.scrollIntoView()
  run(q)
}
const view = (v = "") => {
  document.body.classList.toggle("code", !!v)
  for (const b of $(".view").children) b.ariaPressed = b.dataset.v === v
  on().find(e => e.offsetParent)?.scrollIntoView({block: "nearest"})
  try { localStorage["inspect.view"] = v } catch {}
}
for (const b of $(".view").children) b.onclick = () => view(b.dataset.v)
try { view(localStorage["inspect.view"]) } catch { view() }
const show = m => {
  const ts = m.fmt ??= pretty(m.body), pre = h("pre")
  const r = ref(m), to = n => h("a", {href: "#" + n.id, title: n.desc})
  let plan = []
  try { plan = steps(ts, r) } catch (e) { console.warn(m.id, e) }
  // the queries that the steps name, to colour as they do
  const names = new Set([...plan.flatMap(x => [x.t, ...x.cols ?? []]).join("")
    .matchAll(/\x02([^\x04]*)\x04/g)].map(([, n]) => n.toLowerCase()))
  for (let i = 0; i < ts.length; i++) {
    const x = ts[i], f = r(ts, i)
    const t = ts.slice(i, i + (f?.len ?? 1)).map(x => x.t).join("")
    if (f) i += f.len - 1
    pre.append(f?.n.length === 1 ? Object.assign(to(f.n[0]), {textContent: t})
      : f || x.cl && holds(ts, x.o) ? h("span", {className: "cl", tabIndex: 0,
        dataset: {i}, title: "Run the query to here", onclick: () =>
          mark(i, f ? `from ${t}` : part(ts, i))}, t)
      : x.k === "_" || x.k === "p" ? t
      : h("span", {className: x.k !== "w" ? x.k : K.has(x.w) ? "k"
        : names.has(x.w) && ts[i + 1]?.t !== "(" ? "name" : "w",
        title: ts[i + 1]?.t === "(" && FN[x.w] || ""}, t))
  }
  // a step's text: a model's name, a query's, a file's place, a literal,
  // a call
  const txt = t => t.split(MARK).flatMap((t, j) => {
    const s = t.slice(1, -1)
    return !(j % 2) ? t.split(/\b([a-z_]\w*)(?=\()/).map((t, j) =>
      j % 2 && FN[t] ? h("span", {className: "fn", title: FN[t]}, t) : t)
      : t[0] === "\x01" ? Object.assign(to(by[s]), {textContent: s})
      : t[0] === "\x02" ? h("span", {className: "name"}, s)
      : t[0] === "\x05" ? h("span", {className: s[0]}, s.slice(1))
      : h(/^https?:/.test(s) ? "a" : "span", {className: "at", href: s}, s)
  })
  $("#code").replaceChildren(h("ol", {className: "plan"}, plan.map(x =>
    h("li", {style: `margin-left:${x.d * 1.5}em`, tabIndex: 0,
      dataset: x.i != null && {i: x.i}, onclick: e => x.i == null ||
      e.target.tagName === "A" || mark(x.i, part(ts, x.i))}, txt(x.t),
      x.cols && h("ul", {}, x.cols.map(c => h("li", {}, txt(c))))))), pre)
}

// a node, by the hash: its description, its file and the variables it
// reads, its lineage, then its sql and its table's rows (a test's failing
// rows); no hash, the lineage of every table and test. its place in the
// list comes into view, or on a phone the top of the page
const go = () => {
  const id = decodeURIComponent(location.hash.slice(1)), m = by[id]
  const on = nav.querySelector(`[data-id="${CSS.escape(id)}"]`)
  nav.querySelector(".on")?.classList.remove("on"), on?.classList.add("on")
  narrow.matches ? scrollTo(0, 0) : on?.scrollIntoView({block: "nearest"})
  document.title = [cfg.title, id].filter(Boolean).join(" / ")
  document.body.classList.toggle("all", !id)
  if (!id) return head.replaceChildren(h("h1", {}, cfg.title),
    h("p", {className: "legend"}, groups.map(g =>
      h("span", {style: inG(g)[0].attrs.style}, label(g)))), dag(shown))
  head.replaceChildren(h("h1", {}, id))
  if (!m) return $("#code").replaceChildren(), run.say("Not in this project")
  head.append(...h("div", {}, m.desc && h("p", {}, m.desc), m.note &&
    h("p", {className: "note"}, m.note), m.stale && h("p", {className:
    "note"}, `Its table is from an earlier version: make ${m.target}`),
    h("p", {className: "file"}, m.file,
    ...m.env.map(k => h("span", {}, "$" + k))),
    dag([...up(m), m, ...down(m)].filter(x => x === m ||
      !HIDE.test(x.id)), m)).childNodes)
  show(m)
  m.built ? run(`from ${m.view}`)
    : !m.test ? run.say(`Not built: make ${m.target}`)
    : [...m.reads].every(x => x.built) ? run(m.body)
    : run.say("Not run: a table that it reads is not built")
}
addEventListener("hashchange", go)
go()
</script>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspect</title>

<style>
/* the inspector: the models and tests, a node's lineage, its query as steps
   or as sql, which can be changed and run, and the rows at the step last
   clicked */
:root {
  --bg: #000; --fg: #fff; --mute: #808080; --line: #262626; --panel: #111;
  --hi: #00a3a3; --err: #ff6b6b; --name: #98c379; --s: #e6c07b; --n: #d19a66;
  --mono: ui-monospace, "SF Mono", Menlo, monospace; color-scheme: dark;
  --bar: 49px;
}
@media (prefers-color-scheme: light) { :root {
  --bg: #fff; --fg: #111; --mute: #737373; --line: #e5e5e5; --panel: #f5f5f5;
  --hi: #007a7a; --err: #c62828; --name: #3a7d1c; --s: #8a6100; --n: #b3541e;
  color-scheme: light;
} }
* { box-sizing: border-box; }
body {
  margin: 0; height: 100vh; display: grid; background: var(--bg);
  color: var(--fg); grid: "nav head head" auto "nav q rows" 1fr /
    var(--nav, 16rem) calc((100vw - var(--nav, 16rem)) * var(--split, .5))
    minmax(0, 1fr);
  font: 14px/1.45 system-ui, sans-serif;
}
/* until the page is ready, a line that says why it is not */
.msg { grid-area: 1 / 1 / -1 / -1; place-self: center; color: var(--mute); }
a { color: inherit; text-underline-offset: .2em; }
button {
  font: 12px system-ui; color: var(--mute); background: none; padding: 3px 8px;
  border: 1px solid var(--line); cursor: pointer;
}
button:hover, button[aria-pressed=true] { color: var(--fg); }
nav {
  grid-area: nav; overflow: auto; padding: 0 16px 16px;
  font: 13px/1.6 var(--mono); border-right: 1px solid var(--line);
}
nav input {
  position: sticky; top: 0; width: calc(100% + 32px); margin: 0 -16px;
  padding: 10px 16px; font: inherit; color: inherit; border: 0;
  background: var(--panel); outline: none;
}
nav h2 { margin: 16px 0 4px; font: 500 11px var(--mono); color: var(--mute); }
nav a {
  display: block; text-decoration: none; overflow: hidden;
  text-overflow: ellipsis;
}
nav a::before, .legend span::before { content: "▎"; color: var(--c); }
nav a.schema { margin-top: 12px; }
nav a.schema::before { content: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px var(--mono);
  color: var(--mute); }
body.all header { grid-row: 1 / -1; max-height: none; border: 0; }
body.all #q, body.all #rows, body.all .drag:not(:first-of-type) {
  display: none;
}
nav a:hover, nav a.on { color: var(--hi); }
.off { color: var(--mute); }
header {
  grid-area: head; padding: 16px 20px; max-height: var(--head, 50vh);
  overflow: auto;
  border-bottom: 1px solid var(--line);
}
/* the lines between the panes, to drag */
.drag {
  z-index: 1; width: 8px; margin-right: -4px; justify-self: end;
  cursor: col-resize; touch-action: none;
}
.drag.row {
  width: auto; height: 8px; margin: 0 0 -4px; justify-self: stretch;
  align-self: end; cursor: row-resize;
}
.drag:hover, .drag.on { background: var(--hi); opacity: .5; }
h1 { margin: 0 0 4px; font: 500 18px var(--mono); }
header p { margin: 4px 0; max-width: 80ch; }
header .note, header code { color: var(--mute); }
header .warn { color: var(--err); }
code, pre { font: 12.5px/1.5 var(--mono); }
svg { display: block; margin-top: 12px; font: 12px var(--mono); }
svg path { fill: none; stroke: var(--mute); opacity: .5; }
svg:has(a:hover) path { opacity: .2; }
svg:has(a:hover) path.on { stroke: var(--hi); opacity: 1; stroke-width: 2; }
svg rect { fill: var(--panel); stroke: var(--line); }
svg a:hover rect, svg .on rect { stroke: var(--hi); }
svg text { fill: var(--fg); }
svg text.off { fill: var(--mute); }
#q, #rows { overflow: auto; padding: 16px 20px; }
#q { grid-area: q; }
#rows { grid-area: rows; }
#rows { border-left: 1px solid var(--line); padding-top: 0; }
.view { margin-bottom: 12px; }
.view button + button { margin-left: -1px; }
.view .act { margin-left: 8px; }
body[data-view=sql] ol, body:not([data-view=sql]) pre { display: none; }
ol { margin: 0; padding: 0; list-style: none; max-width: 80ch; }
ol > li {
  margin: 0 0 2px calc(var(--d) * 1.2em); padding: 3px 8px; cursor: pointer;
  border-left: 2px solid var(--line);
}
ol > li:hover { border-color: var(--mute); }
ol > li.on { border-color: var(--hi); background: var(--panel); }
ol ul { margin: 2px 0 0; padding-left: 1.2em; list-style: none; }
.name { color: var(--name); }
.s, .place { color: var(--s); overflow-wrap: anywhere; }
.n { color: var(--n); }
pre {
  margin: 0; min-height: 4lh; white-space: pre-wrap; overflow-wrap: anywhere;
  outline: none;
}
/* the sql is one text, to change: its tokens and the clause of the step in
   view are ranges of it, coloured by name */
::highlight(on) { background-color: var(--line); }
::highlight(KEYWORD) { color: var(--hi); }
::highlight(COMMENT) { color: var(--mute); }
::highlight(STRING_LITERAL) { color: var(--s); }
::highlight(NUMBER_LITERAL) { color: var(--n); }
.status {
  position: sticky; top: 0; display: flex; gap: 12px; align-items: center;
  height: var(--bar); margin: 0 -20px; padding: 0 20px; background: var(--bg);
  color: var(--mute);
}
.via { color: var(--fg); }
.err { color: var(--err); white-space: pre-wrap; font: 12.5px var(--mono); }
table { border-collapse: collapse; font: 12.5px var(--mono); }
th {
  position: sticky; top: var(--bar); background: var(--bg); text-align: left;
  font-weight: 500;
}
th small { display: block; color: var(--mute); font-weight: 400; }
td, th { padding: 3px 12px 3px 0; white-space: nowrap; vertical-align: top; }
td {
  border-top: 1px solid var(--line); max-width: 40ch; overflow: hidden;
  text-overflow: ellipsis;
}
td.num { text-align: right; }
td:empty::after { content: "null"; color: var(--mute); }
/* on a narrow screen, the panes one above another, and the list last */
@media (max-width: 860px) {
  body {
    height: auto; grid: "head" auto "q" auto "rows" 80vh "nav" auto /
      minmax(0, 1fr);
  }
  header, body.all header { grid-row: auto; max-height: none; }
  #rows { border: 0; border-top: 1px solid var(--line); }
  nav { border: 0; border-top: 1px solid var(--line); }
  .drag { display: none; }
}
</style>
<body>
<p class="msg">Run <code>make inspect</code> to open the inspector.</p>
<script type="module">
// the page is a client of the duckdb that make inspect runs, which opens it
// as #<port>:<token>; :<node> after them names the node in view. duckdb has
// the plan (in the database plan), a view on each built table and the
// macros; the page adds to the plan the sql that is changed in it, and the
// tables made from that. the page's sections, in order: words; page
import {QuackClient} from
  "https://cdn.jsdelivr.net/npm/@quack-protocol/sdk@0.3.0/+esm"

// words -----------------------------------------------------------------------

// sql in plain words: a query's plan, its steps in the order that they run,
// from the tree that duckdb's json_serialize_sql gives. explain(node, ref)
// takes a statement's node and ref(name), which gives a model's label for a
// table's name or path (else null), and returns the steps: each has a depth,
// a phrase, its lines (for a select, a filter or a table written by hand),
// the location in the sql of its clause, and its query: json that
// json_deserialize_sql gives back as the sql of its rows. a phrase is a list
// of strings and marks, {kind, text}: a model, a name (a table that the plan
// makes), a place (a file), s a string, n a number. text(phrase) joins it

const text = p => [].concat(p).map(x => x.text ?? x).join("")

// a phrase from a template: its values flattened, empty strings dropped
const w = (s, ...v) => s.flatMap((t, i) => [t, ...[].concat(v[i] ?? [])])
  .filter(x => x !== "")
const join = (ps, sep = ", ", last = sep) => ps.flatMap((p, i) =>
  [i ? i === ps.length - 1 ? last : sep : "", ...[].concat(p)])
  .filter(x => x !== "")
const mark = (kind, text) => ({kind, text: String(text)})
const fill = (t, args) => t.split(/\{(\d)\}/).flatMap((s, i) =>
  i % 2 ? args[s] ?? [] : s ? [s] : [])

// a call in words, by its function's name: a template whose {n} is its nth
// argument; a|b for one argument, then two or more; name() with none
const PHRASES = Object.entries({
  "the number of rows": "count_star count()", "the number of {0}": "count",
  "the total of {0}": "sum", "the mean of {0}": "avg mean",
  "the median of {0}": "median", "the lowest {0}": "min",
  "the highest {0}": "max", "any {0}": "any_value",
  "the first {0}": "first", "the last {0}": "last",
  "the first value of {0}": "first_value",
  "the last value of {0}": "last_value",
  "the {0} with the highest {1}": "arg_max max_by",
  "the {0} with the lowest {1}": "arg_min min_by",
  "the list of {0}": "list array_agg", "{0} joined by {1}": "string_agg",
  "whether any {0}": "bool_or", "whether every {0}": "bool_and",
  "{1} if {0}, else {2}": "if iff", "{0}, null if {1}": "nullif",
  "{0}, else {1}": "ifnull",
  "{0} rounded|{0} rounded to {1} places": "round",
  "{0} rounded down": "floor", "{0} rounded up": "ceil",
  "the size of {0}": "abs", "each of {0}": "unnest",
  "the length of {0}": "len length array_length",
  "the year of {0}": "year", "the month of {0}": "month",
  "{0} as {1}": "strftime", "{1} to the {0}": "date_trunc",
  "the {0}s from {1} to {2}": "date_diff datediff date_sub",
  "{0} with {1} as {2}": "replace regexp_replace",
  "{0} matches {1}": "regexp_matches",
  "the part of {0} that matches {1}": "regexp_extract",
  "{0} starts with {1}": "starts_with prefix",
  "{0} ends with {1}": "ends_with suffix",
  "every part of {0} that matches {1}": "regexp_extract_all",
  "the place of {1} in {0}": "strpos instr list_position list_indexof",
  "{0} read as a date in the form {1}": "strptime try_strptime",
  "the file name in {0}": "parse_filename",
  "the type of {0}": "json_type typeof",
  "each item of {0}|each item of {1} in {0}": "json_each",
  "{0}|the {1} in {0}": "json_extract json_extract_string",
  "the length of {0}|the length of {1} in {0}": "json_array_length",
  "the {0} of {1}": "date_part datepart", "today": "today() current_date()",
  "now": "now() current_timestamp()",
  "the standard deviation of {0}": "stddev stddev_samp",
  "{0} contains {1}": "contains list_contains st_contains",
  "part {2} of {0} split at {1}": "split_part",
  "{0} split at {1}": "string_split str_split", "{0}": "lower upper trim",
  "the previous {0}": "lag", "the next {0}": "lead",
  "the row's place": "row_number()", "the rank": "rank() dense_rank()",
  "the distance from {0} to {1}": "st_distance",
  "{0} meets {1}": "st_intersects", "the point at {0}, {1}": "st_point",
  "{0} is within {2} of {1}": "st_dwithin",
  "{0} filled with {1}|{0} filled with {1}": "format printf"
}).reduce((o, [t, names]) => (names.split(" ").forEach(n => o[n] = t), o), {})
const NEGATED = {regexp_matches: "{0} does not match {1}",
  contains: "{0} does not contain {1}",
  list_contains: "{0} does not contain {1}",
  starts_with: "{0} does not start with {1}",
  ends_with: "{0} does not end with {1}",
  st_intersects: "{0} does not meet {1}"}
const AGGREGATE = new Set(("count_star count sum avg mean median min max " +
  "any_value first last arg_max max_by arg_min min_by list array_agg " +
  "string_agg bool_or bool_and stddev stddev_samp").split(" "))
const SIGNS = {COMPARE_EQUAL: "=", COMPARE_NOTEQUAL: "≠",
  COMPARE_LESSTHAN: "<", COMPARE_GREATERTHAN: ">",
  COMPARE_LESSTHANOREQUALTO: "≤", COMPARE_GREATERTHANOREQUALTO: "≥",
  COMPARE_DISTINCT_FROM: "is not", COMPARE_NOT_DISTINCT_FROM: "is"}
// a like's pattern, by where its %s are: none, at its end, at its start, or
// both; and with a not
const LIKES = {"~~": 0, "!~~": 1, "~~*": 0, "!~~*": 1}
const LIKE_PHRASES = [["is", "is not"], ["starts with", "does not start with"],
  ["ends with", "does not end with"], ["contains", "does not contain"]]
const FILE_READ = new RegExp("^(read_(csv|csv_auto|parquet|json|json_auto|" +
  "ndjson|text|blob|xlsx)|parquet_scan|st_read)$")
const FILE_KINDS = {csv: "CSV file", tsv: "CSV file", parquet: "Parquet file",
  json: "JSON file", ndjson: "JSON file", text: "text file", txt: "text file",
  xlsx: "spreadsheet", shp: "map file", gpkg: "map file", geojson: "map file"}

const args = e => e.arguments?.map(a => a.expression) ?? e.children ?? []
const str = e => e?.type === "VALUE_CONSTANT" && e.literal.kind === "STRING"
  ? e.literal.text : null

// an expression in words
const ex = (c, e) => {
  const t = e.type, x = y => ex(c, y), a = args(e)
  if (t === "COLUMN_REF") return e.column_names.length === 1 &&
    {current_date: "today", current_timestamp: "now"}[e.column_names[0]] ||
    e.column_names.join(".")
  if (t === "VALUE_CONSTANT") {
    const {kind, text} = e.literal
    return kind === "NULL_LITERAL" ? "no value" : kind === "STRING"
      ? [mark("s", `'${text}'`)] : kind === "BOOLEAN" ? text : [mark("n", text)]
  }
  if (t in SIGNS) return w`${op(c, e.left)} ${SIGNS[t]} ${op(c, e.right)}`
  if (t === "COMPARE_BETWEEN" || t === "COMPARE_IN") return negatable(c, e)
  if (t === "CONJUNCTION_AND" || t === "CONJUNCTION_OR") return join(
    a.map(y => y.class === "CONJUNCTION" && y.type !== t ? w`(${x(y)})` : x(y)),
    t === "CONJUNCTION_AND" ? " and " : " or ")
  if (t === "OPERATOR_NOT")
    return negatable(c, a[0], true) ?? w`not ${op(c, a[0])}`
  if (t === "OPERATOR_IS_NULL") return w`${op(c, a[0])} has no value`
  if (t === "OPERATOR_IS_NOT_NULL") return w`${op(c, a[0])} has a value`
  if (t === "OPERATOR_CAST") return x(e.child)
  if (t === "OPERATOR_COALESCE") return join(a.map(y => op(c, y)), ", else ")
  if (t === "CASE_EXPR") return join([...e.case_checks.map(k =>
    w`${op(c, k.then_expr)} if ${x(k.when_expr)}`),
    ...e.else_expr ? [w`else ${op(c, e.else_expr)}`] : []])
  if (t === "SUBQUERY") return negatable(c, e)
  if (t === "ARRAY_EXTRACT") return str(a[1]) != null
    ? w`the ${str(a[1])} in ${op(c, a[0])}`
    : w`item ${x(a[1])} of ${op(c, a[0])}`
  if (t === "ARRAY_SLICE")
    return w`items ${x(a[1])} to ${x(a[2])} of ${op(c, a[0])}`
  if (t === "LAMBDA") return w`${x(e.lhs)} → ${x(e.expr)}`
  if (t === "STAR") return "every column"
  if (e.class === "WINDOW") return w`${call(c, e)}${frame(c, e)}`
  if (t === "FUNCTION") return e.is_operator ? operator(c, e) : call(c, e)
  return t.toLowerCase()
}
// an operand: in brackets if it has an else or a window of its own
const op = (c, e) => {
  const p = ex(c, e)
  return text(p).includes(", else ") || e.partitions?.length ||
    e.orders?.length ? w`(${p})` : p
}

// between, in, a query and their nots
const negatable = (c, e, not = false) => {
  const t = e.type, a = args(e), n = +not
  if (t === "COMPARE_BETWEEN") return w`${op(c, e.input)} is ${
    not ? "not " : ""}from ${op(c, e.lower)} to ${op(c, e.upper)}`
  if (t === "COMPARE_IN") {
    const l = a.slice(1).map(y => op(c, y))
    return w`${op(c, a[0])} is ${l.length > 2
      ? w`${["one of ", "none of "][n]}${join(l, ", ", " and ")}`
      : l.length > 1 ? not ? w`neither ${l[0]} nor ${l[1]}`
        : w`either ${l[0]} or ${l[1]}` : w`${not ? "not " : ""}${l[0]}`}`
  }
  if (t === "SUBQUERY") {
    const name = made(c, e.subquery.node)
    return e.subquery_type === "EXISTS"
      ? w`there are ${not ? "no " : ""}rows in ${name}`
      : e.subquery_type === "ANY"
      ? w`${op(c, e.child)} is ${not ? "not " : ""}in ${name}`
      : not ? w`not ${name}` : name
  }
  if (t === "FUNCTION" && e.function_name in LIKES) return like(c, e, not)
  if (t === "FUNCTION" && not && NEGATED[e.function_name])
    return fill(NEGATED[e.function_name], a.map(y => op(c, y)))
  if (t === "OPERATOR_IS_NULL" && not) return w`${op(c, a[0])} has a value`
}
// like: a % at its start or its end, and none inside, said in words
const like = (c, e, not) => {
  const [v, p] = args(e), s = str(p), name = e.function_name
  not = not !== (LIKES[name] === 1)
  if (s == null || /%/.test(s.slice(1, -1)))
    return w`${op(c, v)} ${not ? "not " : ""}${
      name.includes("*") ? "ilike" : "like"} ${ex(c, p)}`
  const k = +s.endsWith("%") + 2 * s.startsWith("%")
  return w`${op(c, v)} ${LIKE_PHRASES[k][+not]} ${
    mark("s", `'${s.slice(k > 1, k % 2 ? -1 : undefined)}'`)}${
    name.includes("*") ? " (in any case)" : ""}`
}
const operator = (c, e) => {
  const a = args(e), name = e.function_name, [l, r] = a.map(y => op(c, y))
  if (name in LIKES) return like(c, e, false)
  if (a.length === 1) return w`${name}${l}`
  if (name === "||") return join(a.map(y => op(c, y)), " followed by ")
  if (name === "->" || name === "->>") {
    const k = str(a[1])
    return k == null ? w`item ${r} of ${l}` : k.replace(/^\$\.?/, "")
      ? w`the ${k.replace(/^\$\.?/, "")} in ${l}` : l
  }
  return w`${l} ${name} ${r}`
}
// a call, by its phrase or as written, with its filter and its order
const call = (c, e) => {
  const name = e.function_name, a = args(e)
  const ps = a.map(y => PHRASES[name] && /^(\$\.)?\w+(\.\w+)*$/
    .test(str(y) ?? "-") ? str(y).replace(/^\$\./, "") : op(c, y))
  if (e.distinct && ps.length) ps[0] = w`distinct ${ps[0]}`
  const t = PHRASES[a.length ? name : name + "()"] ?? PHRASES[name]
  const forms = t?.split("|")
  const p = name === "getenv" ? w`$${str(a[0]) ?? ps[0]}`
    : name === "concat" ? join(ps, " followed by ")
    : name === "greatest" || name === "least"
    ? w`the ${name} of ${join(ps, ", ", " and ")}`
    : name === "list_value" ? w`[${join(ps)}]`
    : name === "struct_pack"
    ? w`{${join(ps.map((p, i) => w`${e.arguments[i].name}: ${p}`))}}`
    : forms ? fill(forms[Math.max(0, Math.min(a.length, forms.length) - 1)],
      name === "format" || name === "printf" ? [ps[0], join(ps.slice(1))] : ps)
    : w`${name}(${join(ps)})`
  const order = e.order_bys?.orders?.length
    ? w` in order of ${orders(c, e.order_bys.orders)}` : []
  return w`${p}${order}${e.filter || e.filter_expr ? w` among the rows where ${
    ex(c, e.filter ?? e.filter_expr)}` : ""}${
    e.ignore_nulls ? ", skipping missing values" : ""}`
}
// a window: within each partition. a total or a last value with an order
// and no frame of its own is of the rows so far; without either, of all
// the rows
const BOUNDS = {UNBOUNDED_PRECEDING: "the first row",
  UNBOUNDED_FOLLOWING: "the last row"}
const bound = (c, b, e) => BOUNDS[b] ?? (/^CURRENT/.test(b) ? "this row"
  : str(e) === "1" || e?.literal?.text === "1"
  ? `the row ${/PRECEDING/.test(b) ? "before" : "after"}`
  : w`${ex(c, e)} rows ${/PRECEDING/.test(b) ? "before" : "after"}`)
const frame = (c, e) => {
  const sum = AGGREGATE.has(e.function_name) || e.function_name === "last_value"
  const framed = !(e.start === "UNBOUNDED_PRECEDING" &&
    /^CURRENT_ROW_RANGE|^UNBOUNDED_FOLLOWING/.test(e.end))
  const parts = e.partitions?.length
    ? w` within each ${join(e.partitions.map(p => ex(c, p)))}` : []
  const order = e.orders?.length ? w`${sum && !framed ? ", so far" : ""
    } in order of ${orders(c, e.orders)}` : []
  return parts.length || order.length || framed && sum ? w`${parts}${order}${
    sum && framed ? w`, from ${bound(c, e.start, e.start_expr)} to ${
      bound(c, e.end, e.end_expr)}` : ""}` : sum ? " across all the rows" : []
}
const orders = (c, os) => join(os.map(o =>
  w`${ex(c, o.expression)}${o.type === "DESCENDING" ? " descending" : ""}`))

// tables

// a table: a model, a file, a query's name or its words, with its alias. a
// table written by hand is its size, its rows kept for its step
const table = (c, t) => {
  const as = t.alias && !/^valueslist$/i.test(t.alias)
    ? ` as ${t.alias}` : ""
  if (t.type === "BASE_TABLE") {
    const name = [t.schema_name, t.table_name].filter(Boolean).join(".")
    const model = c.ref(name)
    if (model) return w`${mark("model", model)}${
      t.alias && t.alias !== t.table_name ? as : ""}`
    if (c.names.has(name.toLowerCase()))
      return w`${mark("name", name)}${as}`

// the sql's text, as it is or as changed: a new line may be a br
const read = (e = sql) => [...e.childNodes].map(c => c.data ?? "\n").join("")
// where the caret is in the sql, in characters; -1 if it is not there
const caret = () => {
  const s = getSelection(), r = new Range
  if (!sql.contains(s.focusNode)) return -1
  r.selectNodeContents(sql), r.setEnd(s.focusNode, s.focusOffset)
  return read(r.cloneContents()).length
}
const status = $("p", {class: "status"}), grid = $("div")
const view = v => {
  document.body.dataset.view = v
  try { localStorage.view = v } catch {}
  for (const b of toggle.children) b.ariaPressed = b.value === v
}
const toggle = $("div", {class: "view"}, ["steps", "sql"].map(v =>
  $("button", {value: v, onclick: () => view(v)}, v[0].toUpperCase() +
    v.slice(1).replace("ql", "QL"))), run, revert)
const schema = $("a", {href: `#${port}:${token}`, class: "schema"}, "Schema")
msg.remove()
document.body.append($("nav", {}, search, schema, list),
  head, $("section", {id: "q"}, toggle, steps, sql),
  $("section", {id: "rows"}, status, grid))
try { view(localStorage.view === "sql" ? "sql" : "steps") }
catch { view("steps") }

// the lines between the panes move, and stay where they were put: the
// list's (in pixels), the head's (a share of the window's height) and the
// one between the query and the rows (a share of the width beside the list)
const nav = document.querySelector("nav")
const clamp = (v, low, high) => Math.min(high, Math.max(low, v))
const drag = (prop, at, area, row = false) => {
  const h = $("div", {class: row ? "drag row" : "drag", role: "separator",
    "aria-orientation": row ? "horizontal" : "vertical",
    style: `grid-area: ${area}`})
  const set = v => document.body.style.setProperty(prop, v)
  try { localStorage[prop] && set(localStorage[prop]) } catch {}
  h.onpointerdown = e => {
    e.preventDefault(), h.setPointerCapture(e.pointerId)
    h.classList.add("on")
  }
  h.onpointermove = e => h.hasPointerCapture(e.pointerId) && set(at(e))
  h.onlostpointercapture = () => {
    h.classList.remove("on")
    try { localStorage[prop] = document.body.style.getPropertyValue(prop) }
    catch {}
  }
  return h
}
document.body.append(
  drag("--nav", e => clamp(e.clientX, 120, innerWidth / 2) + "px",
    "1 / 1 / 3 / 2"),
  drag("--split", e => clamp((e.clientX - nav.offsetWidth) /
    (innerWidth - nav.offsetWidth), .15, .85), "2 / 2"),
  drag("--head", e => clamp(e.clientY / innerHeight * 100, 8, 85) + "vh",
    "1 / 2 / 2 / 4", true))

search.oninput = () => {
  const q = search.value.toLowerCase()
  for (const [n, a] of links) a.hidden = !label(n).includes(q)
  for (const s of list) s.hidden = ![...s.querySelectorAll("a")]
    .some(a => !a.hidden)
}
// j or down opens the next node in the list as it is shown, k or up the one
// before
document.onkeydown = e => {
  const step = {j: 1, ArrowDown: 1, k: -1, ArrowUp: -1}[e.key]
  if (!step || e.target === search || e.target === sql || e.metaKey ||
    e.ctrlKey) return
  const shown = list.flatMap(s => [...s.querySelectorAll("a:not([hidden])")])
  const at = shown.findIndex(a => a.classList.contains("on"))
  shown[Math.max(0, Math.min(shown.length - 1, at + step))]?.click()
  e.preventDefault()
}

// a phrase from words.js: a model linked, a name, a place and a literal
// set apart
const phrase = p => p.map(x => typeof x === "string" ? x
  : x.kind === "model" && byLabel[x.text]
  ? $("a", {href: href(byLabel[x.text])}, x.text)
  : $("span", {class: x.kind}, x.text))

// the lineage: nodes in columns by depth, by schema within a column; a
// curve from each node to each that reads it. a node's is itself, every
// node before it and every node after it
const reach = (node, from, to) => {
  const seen = new Set([node.id])
  for (const id of seen) for (const e of edges)
    if (e[from] === id && byId[e[to]]) seen.add(e[to])
  return seen
}
const lineage = (shown, node) => {
  const depths = [...new Set(shown.map(n => n.depth))].sort((a, b) => a - b)
  const cols = depths.map(d => shown.filter(n => n.depth === d)
    .sort((a, b) => order.indexOf(a.schema) - order.indexOf(b.schema) ||
      label(a).localeCompare(label(b))))
  const w = 16 + 7.3 * Math.max(...shown.map(n => label(n).length)), h = 22
  const xy = Object.fromEntries(cols.flatMap((col, x) => col.map((n, y) =>
    [n.id, [x * (w + 48), y * (h + 8)]])))
  // a node's lines, marked while it is under the pointer
  const light = id => svg.querySelectorAll("path").forEach(p =>
    p.classList.toggle("on", p.dataset.ends.split(" ").includes(id)))
  const svg = $("svg", {width: cols.length * (w + 48) - 48,
    height: Math.max(...cols.map(c => c.length)) * (h + 8) - 8},
    edges.filter(e => xy[e.dep] && xy[e.target]).map(e => {
      const [x0, y0] = xy[e.dep], [x1, y1] = xy[e.target], m = (x0 + w + x1) / 2
      return $("path", {"data-ends": `${e.dep} ${e.target}`, d: `M${x0 + w} ${
        y0 + h / 2}C${m} ${y0 + h / 2} ${m} ${y1 + h / 2} ${x1} ${y1 + h / 2}`})
    }),
    shown.map(n => $("svg:a", {href: href(n), class: n === node ? "on" : "",
      onpointerenter: () => light(n.id), onpointerleave: () => light()},
      $("rect", {x: xy[n.id][0], y: xy[n.id][1], width: w, height: h}),
      $("rect", {x: xy[n.id][0], y: xy[n.id][1], width: 3, height: h,
        style: `fill: ${colour(n)}; stroke: none`}),
      $("text", {x: xy[n.id][0] + 10, y: xy[n.id][1] + 15,
        class: n.built || n.kind === "tests" ? "" : "off"}, label(n)))))
  return svg
}

// the rows of a query, or of a promise of one: its first ROWS as duckdb
// writes them, its columns' types, and how long it took; the count only
// when asked for. an error of a kind in HINTS has its likely cause before it.
// before them, the changed nodes that the node in view has its rows from
const ROWS = 500
const HINTS = () => [[/Referenced (table|column)|not found in FROM/, "This " +
  "part cannot run alone if it uses columns of the query around it."],
  [/Table with name|does not exist|No files found/, current?.via.length
    ? "A model that this reads fails with the edit."
    : "A table that this reads is not built: make builds it."]]
let running = 0, current
const via = () => current?.via.length ? [$("span", {class: "via"},
  `Recomputed from edit${current.via.length > 1 ? "s" : ""} to `,
  current.via.flatMap((l, i, a) => [i ? i < a.length - 1 ? ", " : " and " : "",
    $("code", {}, l)]))] : []
const rows = async sql => {
  const turn = ++running, t = performance.now()
  status.replaceChildren("Running…")
  try {
    const query = await sql
    const [data, types] = await Promise.all([all(
      `select columns(*)::varchar from (${query}) limit ${ROWS + 1}`),
      all(`describe ${query}`)])
    if (turn !== running) return
    const more = data.length > ROWS, n = types.length
    const count = $("button", {onclick: async () => {
      count.replaceWith($("span", {}, `${(await all(`select count(*)::int n
        from (${query})`))[0].n.toLocaleString()} rows in all`))
    }}, "Count")
    status.replaceChildren(...via(), $("span", {}, `${Math.min(data.length,
      ROWS).toLocaleString()}${more ? "+" : ""} rows, ${n} column${n === 1
      ? "" : "s"} in ${Math.round(performance.now() - t)} ms`),
      ...more ? [count] : [])
    const num = types.map(c => /INT|DECIMAL|DOUBLE|FLOAT|REAL/
      .test(c.column_type))
    grid.replaceChildren($("table", {}, $("tr", {}, types.map(c => $("th", {},
      c.column_name, $("small", {}, c.column_type.toLowerCase())))),
      data.slice(0, ROWS).map(r => $("tr", {}, types.map((c, i) => $("td",
        {class: num[i] ? "num" : "", title: r[c.column_name] ?? ""},
        r[c.column_name]))))))
  } catch (e) {
    if (turn !== running) return
    const hint = HINTS().find(([re]) => re.test(e.message))?.[1]
    status.replaceChildren(...via())
    grid.replaceChildren($("p", {class: "err"}, hint ? `${hint}\n\n` : "",
      e.message))
  }
}

// a node: its head, its lineage, its steps and its sql, and the rows of
// all of it. a click on a step, or on the sql of its clause, runs the query
// to it and marks it in both. its sql as changed and run is kept, and the
// models after it are made again. with no node, the schema: the lineage of
// every node, and its schemas' colours
const [{dir}] = await all("select parse_filename(getenv('PWD')) dir")
const narrow = matchMedia("(max-width: 860px)")
const open = async node => {
  current = node, running++
  for (const [n, a] of links) a.classList.toggle("on", n === node)
  schema.classList.toggle("on", !node)
  document.body.classList.toggle("all", !node)
  document.title = [dir, node && label(node)].filter(Boolean).join(" / ")
  if (!node) return head.replaceChildren($("h1", {}, dir),
    $("p", {class: "legend"}, order.map(g => $("span",
      {style: `--c: ${colour(groups[g][0])}`}, g))), lineage(nodes))
  narrow.matches ? scrollTo(0, 0)
    : links.get(node).scrollIntoView({block: "nearest"})
  status.replaceChildren("Running…"), grid.replaceChildren()
  const [lead = "", ...rest] = node.content.match(/^(\s*--.*\n)*/)[0]
    .split(/^\s*--\s*$/m)
  const prose = s => s.replace(/^\s*-- ?/gm, "").trim()
  // shown at once; the check of its table's sql waits for duckdb
  const old = $("p", {class: "warn", hidden: true}, "Its table is from an " +
    "earlier version of its file: make rebuilds it.")
  node.built && all(`select decode(value) v from parquet_kv_metadata(${lit(
    node.out)}) where decode(key) = 'sql' limit 1`)
    .then(([s]) => old.hidden = !s || s.v === node.content)
  head.replaceChildren($("div", {}, $("h1", {}, label(node)),
    prose(lead) && $("p", {}, prose(lead)),
    rest.length ? $("p", {class: "note"}, prose(rest.join(""))) : null,
    $("code", {}, node.file),
    node.kind === "models" && !node.built ? $("p", {class: "warn"},
      "Not built: make builds its table.") : null,
    old,
    lineage(nodes.filter(n => reach(node, "target", "dep").has(n.id) ||
      reach(node, "dep", "target").has(n.id)), node)))
  // the sql as last run, and the buttons: run if it has changed since,
  // revert if it is not the file's
  let shown
  const mark = () => {
    run.hidden = read() === shown
    revert.hidden = shown === node.content
  }
  // keep: the text is a change to run, or the file's to go back to
  const show = async (text, keep) => {
    const c = caret()
    sql.textContent = shown = node.draft = text
    if (c >= 0 && text) getSelection().collapse(sql.firstChild,
      Math.min(c, text.length))
    CSS.highlights?.clear(), steps.replaceChildren(), mark()
    const [[{ast}], tokens] = await Promise.all([
      all(`select json_serialize_sql(${lit(text)}, skip_null := true,
        skip_empty := true)::varchar ast`),
      all(`from sql_tokenize(${lit(text)})`)])
    if (current !== node) return
    const tree = JSON.parse(ast)
    if (tree.statements?.length !== 1) return rows(Promise.reject(Error(
      tree.error_message ?? "Expected one SELECT statement.")))
    if (keep) {
      status.replaceChildren("Running…")
      await all(text === node.content ? `delete from plan.main.draft
        where target = ${lit(node.id)}` : `insert or replace into
        plan.main.draft values (${lit(node.id)}, ${lit(text)})`)
      await sync(node)
      if (current !== node) return
    }
    const plan = explain(tree.statements[0].node, ref)
    // each step from the first keyword of its clause, as tokens mark it
    const starts = tokens.map(t => t.start)
    const at = plan.map(s => {
      let i = starts.findLastIndex(p => p <= s.at)
      while (i > 0 && tokens[i - 1].token_type === "KEYWORD") i--
      return i < 0 ? Infinity : starts[i]
    })
    const end = i => Math.min(...at.filter(a => a > at[i]), text.length)
    const paint = (name, spans) => CSS.highlights?.set(name, new Highlight(
      ...spans.map(([a, b]) => {
        const r = new Range
        r.setStart(sql.firstChild, a), r.setEnd(sql.firstChild, b)
        return r
      })))
    for (const [type, ts] of Object.entries(Object.groupBy(tokens.map((t, i) =>
      [t.start, starts[i + 1] ?? text.length, t.token_type]), t => t[2])))
      paint(type, ts)
    const pick = i => {
      steps.querySelectorAll(".on").forEach(e => e.classList.remove("on"))
      steps.children[i]?.classList.add("on")
      paint("on", i < 0 || at[i] === Infinity ? [] : [[at[i], end(i)]])
      rows(all(`select json_deserialize_sql(${lit(i < 0 ? ast
        : plan[i].query)}::json) q`).then(([{q}]) => q))
    }
    steps.replaceChildren(...plan.map((s, i) => $("li", {
      style: `--d: ${s.depth}`, onclick: () => pick(i)}, phrase(s.text),
      s.lines && $("ul", {}, s.lines.map(l => $("li", {}, phrase(l)))))))
    // a click on the sql as last run is a click on the step of its clause
    sql.onclick = () => read() === shown && getSelection()
      .isCollapsed && pick(at.lastIndexOf(Math.max(...at.filter(a =>
        a <= caret()))))
    pick(-1)
  }
  sql.oninput = () => (node.draft = read(), mark())
  sql.onkeydown = e => {
    if (e.key !== "Enter" || !e.metaKey && !e.ctrlKey) return
    e.preventDefault(), show(read(), true)
  }
  run.onclick = () => show(read(), true)
  revert.onclick = () => show(node.content, true)
  show(node.draft ?? node.content)
}

const route = () => {
  open(byId[decodeURI(location.hash).split(":").slice(2).join(":")])
}
onhashchange = route
route()
</script>
